[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "earctl"
version = "0.2.0"
description = "Energy aware recovery for agentic LLM workflows: EAR chooses where to restart after a failure."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.scripts]
earctl-parity = "earctl.parity:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
earctl = ["_vendor/SOURCES.json", "params/*.json"]
