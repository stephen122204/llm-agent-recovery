server:
  host: 127.0.0.1
  port: 8501
  debug: false
database:
  engine: sqlite
  sqlite:
    db_name: experiments.db
    journal_mode: WAL
    timeout: 30
    detect_types: 1
  pool_pre_ping: true
  backup_enabled: true
  backup_interval_hours: 24
paths:
  log: logs/a-lems.log
  data: data/
  exports: exports/
  temp: tmp/
timeouts:
  execution_seconds: 300
  api_seconds: 30
  measurement_seconds: 600
  database_seconds: 10
experiment:
  default_iterations: 10
  cool_down_seconds: 30
  parallel_execution: true
  max_concurrent_tasks: 2
  save_raw_data: true
  baseline:
    force_remeasure: false
    duration_seconds: 30
    num_samples: 3
    pre_wait_seconds: 10
    measure_gpu: true
msr:
  enable_aperf_mperf: false
  wakeup_latency_iterations: 500
  measure_cores:
  - 0
  parallel_measurement: false
logging:
  level: INFO
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  rotation: 1 day
  retention: 30 days
alerts:
  temperature_threshold_celsius: 85
  power_threshold_watts: 50
  memory_threshold_mb: 3500
webui:
  enabled: false
  servers: []
  sampling_rate_hz: 10
  timeout_ms: 1
extensions:
  active:
  - tool_selection
plugins:
  synthetic:
    enabled: false
    mode: constant
    package_uj: 9999999
